<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="t d">
  <title id="t">Infographic: Tranh dân gian Đông Hồ – Sắc màu từ thiên nhiên</title>
  <desc id="d">Năm màu tự nhiên của tranh Đông Hồ, bốn công đoạn làm tranh bằng tay và thông tin UNESCO ghi danh ngày 9/12/2025.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#c9b48a" opacity=".55"/></pattern>
    <pattern id="wave" width="60" height="20" patternUnits="userSpaceOnUse"><path d="M0 14 Q15 2 30 14 T60 14" fill="none" stroke="#b5462f" stroke-width="2" opacity=".55"/></pattern>
    <style>
      .serif{font-family:Lora,Georgia,"Times New Roman",serif}
      .sans{font-family:"Be Vietnam Pro","Segoe UI",Arial,sans-serif}
    </style>
  </defs>
  <!-- Nền giấy dó phủ điệp -->
  <rect width="800" height="1120" fill="#f4ead6"/>
  <rect width="800" height="1120" fill="url(#dots)"/>
  <rect x="22" y="22" width="756" height="1076" fill="none" stroke="#1f1b16" stroke-width="3"/>
  <rect x="32" y="32" width="736" height="1056" fill="none" stroke="#b5462f" stroke-width="1.5"/>

  <!-- Tiêu đề -->
  <rect x="32" y="32" width="736" height="24" fill="url(#wave)"/>
  <text x="400" y="104" text-anchor="middle" class="sans" font-size="17" letter-spacing="5" fill="#b5462f" font-weight="700">DI SẢN VĂN HÓA VIỆT NAM</text>
  <text x="400" y="162" text-anchor="middle" class="serif" font-size="50" font-weight="700" fill="#1f1b16">Tranh dân gian Đông Hồ</text>
  <text x="400" y="204" text-anchor="middle" class="serif" font-size="25" font-style="italic" fill="#2f5d50">Sắc màu từ thiên nhiên</text>

  <!-- UNESCO -->
  <g transform="translate(90 236)">
    <rect width="620" height="92" rx="14" fill="#1f1b16"/>
    <circle cx="56" cy="46" r="30" fill="none" stroke="#e6b450" stroke-width="3"/>
    <text x="56" y="54" text-anchor="middle" class="serif" font-size="22" font-weight="700" fill="#e6b450">9/12</text>
    <text x="106" y="38" class="sans" font-size="17" font-weight="700" fill="#f4ead6">UNESCO ghi danh năm 2025</text>
    <text x="106" y="64" class="sans" font-size="15" fill="#e8dcc4">Danh sách di sản văn hóa phi vật thể cần bảo vệ khẩn cấp</text>
  </g>

  <!-- Năm màu -->
  <text x="70" y="384" class="serif" font-size="27" font-weight="700" fill="#1f1b16">Năm màu, năm nguồn tự nhiên</text>
  <line x1="70" y1="398" x2="190" y2="398" stroke="#b5462f" stroke-width="3"/>
  <g class="sans" transform="translate(70 420)">
    <g><rect width="120" height="120" rx="60" fill="#1f1b16"/><text x="60" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#1f1b16">Đen</text><text x="60" y="176" text-anchor="middle" font-size="14" fill="#5a5146">than lá tre</text></g>
    <g transform="translate(135 0)"><rect width="120" height="120" rx="60" fill="#b5462f"/><text x="60" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#1f1b16">Đỏ</text><text x="60" y="176" text-anchor="middle" font-size="14" fill="#5a5146">sỏi son</text></g>
    <g transform="translate(270 0)"><rect width="120" height="120" rx="60" fill="#d9a23a"/><text x="60" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#1f1b16">Vàng</text><text x="60" y="176" text-anchor="middle" font-size="14" fill="#5a5146">hoa hòe</text></g>
    <g transform="translate(405 0)"><rect width="120" height="120" rx="60" fill="#2f5d50"/><text x="60" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#1f1b16">Xanh</text><text x="60" y="176" text-anchor="middle" font-size="14" fill="#5a5146">lá chàm</text></g>
    <g transform="translate(540 0)"><rect width="120" height="120" rx="60" fill="#fbf7ee" stroke="#c9b48a" stroke-width="3"/><path d="M30 70 Q60 30 90 70" fill="none" stroke="#c9b48a" stroke-width="3"/><text x="60" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#1f1b16">Trắng</text><text x="60" y="176" text-anchor="middle" font-size="14" fill="#5a5146">vỏ điệp</text></g>
  </g>

  <!-- Giấy dó -->
  <g transform="translate(70 630)">
    <rect width="660" height="76" rx="12" fill="#fbf7ee" stroke="#c9b48a"/>
    <text x="24" y="33" class="sans" font-size="17" font-weight="700" fill="#2f5d50">Nền tranh: giấy dó phủ điệp</text>
    <text x="24" y="58" class="sans" font-size="15" fill="#5a5146">Giấy làm từ vỏ cây dó, quét lớp bột vỏ điệp tạo ánh lấp lánh đặc trưng.</text>
  </g>

  <!-- Quy trình -->
  <text x="70" y="764" class="serif" font-size="27" font-weight="700" fill="#1f1b16">Bốn công đoạn — đều làm bằng tay</text>
  <line x1="70" y1="778" x2="190" y2="778" stroke="#b5462f" stroke-width="3"/>
  <g class="sans" transform="translate(70 802)">
    <g><rect width="150" height="150" rx="14" fill="#fbf7ee" stroke="#1f1b16" stroke-width="2"/><text x="75" y="58" text-anchor="middle" class="serif" font-size="40" font-weight="700" fill="#b5462f">1</text><text x="75" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1b16">Sáng tác</text><text x="75" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1b16">mẫu</text></g>
    <path d="M156 75 h18" stroke="#b5462f" stroke-width="3"/><path d="M170 69 l8 6 -8 6" fill="none" stroke="#b5462f" stroke-width="3"/>
    <g transform="translate(170 0)"><rect width="150" height="150" rx="14" fill="#fbf7ee" stroke="#1f1b16" stroke-width="2"/><text x="75" y="58" text-anchor="middle" class="serif" font-size="40" font-weight="700" fill="#b5462f">2</text><text x="75" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1b16">Khắc ván</text><text x="75" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1b16">in gỗ</text></g>
    <path d="M326 75 h18" stroke="#b5462f" stroke-width="3"/><path d="M340 69 l8 6 -8 6" fill="none" stroke="#b5462f" stroke-width="3"/>
    <g transform="translate(340 0)"><rect width="150" height="150" rx="14" fill="#fbf7ee" stroke="#1f1b16" stroke-width="2"/><text x="75" y="58" text-anchor="middle" class="serif" font-size="40" font-weight="700" fill="#b5462f">3</text><text x="75" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1b16">Làm màu</text><text x="75" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1b16">tự nhiên</text></g>
    <path d="M496 75 h18" stroke="#b5462f" stroke-width="3"/><path d="M510 69 l8 6 -8 6" fill="none" stroke="#b5462f" stroke-width="3"/>
    <g transform="translate(510 0)"><rect width="150" height="150" rx="14" fill="#1f1b16"/><text x="75" y="58" text-anchor="middle" class="serif" font-size="40" font-weight="700" fill="#e6b450">4</text><text x="75" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#f4ead6">In tranh</text><text x="75" y="118" text-anchor="middle" font-size="14" fill="#e8dcc4">mỗi màu một ván</text></g>
  </g>

  <!-- Chân -->
  <text x="400" y="1010" text-anchor="middle" class="sans" font-size="15" fill="#1f1b16">Làng Đông Hồ · khu phố Đông Khê, phường Thuận Thành, tỉnh Bắc Ninh</text>
  <text x="400" y="1046" text-anchor="middle" class="sans" font-size="12.5" fill="#5a5146">Nguồn: Đại biểu Nhân dân (09/12/2025); Tuổi Trẻ (20/10/2008); Sài Gòn Giải Phóng (18/12/2025)</text>
  <text x="400" y="1068" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#b5462f">Thiết kế có sự hỗ trợ của AI (Claude – Anthropic) · Sinh viên kiểm chứng và biên tập</text>
</svg>
